<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>강의실 신청 테스트 · 학교생활지원 시스템</title>
</head>
<body>
<header><a href="./" aria-label="학교생활지원 시스템 첫 화면"><img src="./src/school-mark.svg" alt="" width="56" height="56"></a></header>
<main>
  <h1>강의실 신청 테스트</h1>
  <p>등록된 가상 계정으로 신청해 주세요.</p>
  <button id="login" type="button">Google 로그인</button>
  <button id="logout" type="button" hidden>로그아웃</button>
  <p id="auth-status" role="status"></p>
  <form id="booking-test-form" hidden>
    <label>강의실
      <select name="room" required>
        <option>강당</option><option>도서관</option><option>7-1</option>
      </select>
    </label>
    <label>교시
      <select name="period" required>
        <option>저녁2교시</option><option>저녁1교시</option><option>9교시</option>
      </select>
    </label>
    <button type="submit">신청</button>
  </form>
  <p id="booking-test-status" role="status"></p>
</main>
<script type="module" src="./src/booking-test.js"></script>
</body>
</html>
